{% extends "allauth/layouts/base.html" %}
{% block head_title %}{{ titulo }}{% endblock %}
{% block content %}
  <h1>{{ titulo }}</h1>
  {% if aviso %}<p>{{ aviso }}</p>{% endif %}
  <form method="post">{% csrf_token %}
    {% if form %}{{ form.as_p }}{% endif %}
    <button type="submit">{{ boton }}</button>
  </form>
{% endblock %}
