version: 2

updates:
  # Dependencias Python declaradas en requirements.txt (raíz del repo).
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(pip)"
    labels:
      - "dependencias"
      - "python"
    ignore:
      # Django 6.x no es compatible con la arquitectura (5.2 LTS).
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
      # Ninguna otra dependencia salta de versión mayor automáticamente.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Imágenes base de Dockerfile y Dockerfile.autorizador (raíz del repo).
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(docker)"
    labels:
      - "dependencias"
      - "docker"
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
