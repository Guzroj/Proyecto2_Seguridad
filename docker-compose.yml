# Entorno de DESARROLLO LOCAL. En producción la base es Neon y la app corre en Cloud Run.
# Las credenciales salen de .env (ignorado por git; ver .env.example).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"   # solo accesible desde esta máquina
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    environment:
      # Dentro de compose la base se llama "db", no localhost.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTORIZADOR_URL: http://autorizador:8080
      AUTORIZADOR_AUTENTICACION: ninguna
    volumes:
      - .:/app                   # el código local se ve en vivo dentro del contenedor
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      autorizador:
        condition: service_healthy

  # Motor de autorización (PDP): mismo camino HTTP que en producción, sin acceso a la base.
  # En local no hay token OIDC; el cliente solo acepta AUTORIZADOR_AUTENTICACION=ninguna con DEBUG.
  autorizador:
    build:
      context: .
      dockerfile: Dockerfile.autorizador
    command: uvicorn autorizacion.app:app --host 0.0.0.0 --port 8080 --reload
    volumes:
      - ./autorizacion:/app/autorizacion:ro
    ports:
      - "127.0.0.1:8080:8080"   # solo para probar a mano desde esta máquina
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
